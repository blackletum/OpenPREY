name: openPR06 Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openpr06-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold-contracts:
    name: Scaffold and Content Contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout openPR06
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate scripts and in-tree game sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/build/build_openq4_pack.py \
            tools/build/generate_pak_header.py \
            tools/build/generate_savegame_compat_header.py \
            tools/build/openq4_pak.py \
            tools/build/game_source_inventory.py             tools/build/content_packs.py \
            tools/build/write_pak_manifest.py \
            tools/tests/openpr06_rebase_contract.py \
            tools/tests/prey_video_menu_contract.py \
            tools/tests/linux_sanitizer_source_contract.py
          bash -n tools/build/meson_setup.sh
          python tools/build/sync_icons.py --check
          python tools/build/game_source_inventory.py . > /dev/null
          python tools/build/content_packs.py meson-list
          python tools/tests/openpr06_rebase_contract.py
          python tools/tests/prey_video_menu_contract.py
          python tools/tests/linux_sanitizer_source_contract.py

      - name: Validate pak0 and pak1 inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/ci-paks
          for pak in pak0 pak1; do
            python tools/build/write_pak_manifest.py \
              "${GITHUB_WORKSPACE}" \
              "${pak}.pk4" \
              "content/basepr/${pak}" \
              ".tmp/ci-paks/${pak}.sources"
            python tools/build/build_openq4_pack.py \
              --pak-name "${pak}.pk4" \
              --source-dir "content/basepr/${pak}" \
              --manifest ".tmp/ci-paks/${pak}.sources" \
              --out ".tmp/ci-paks/${pak}.pk4"
          done

  # The Android host, touch and GLES checks openQ4's push verification runs.
  # They compile small host-side harnesses (clang++/g++, javac); the native
  # NDK build and APK verification stay in android-build.yml.
  android-host:
    name: Android Host and GLES Checks
    needs: scaffold-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout openPR06
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Setup Java for Android host storage validation
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Android host checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/build/android_cross.py \
            tools/build/android_elf.py \
            tools/build/prepare_android_deps.py \
            tools/build/verify_android_apk.py \
            tools/tests/android_emulator_smoke.py \
            tools/tests/android_device_qualification.py
          for test in \
            android_build android_touch_input android_touch_controls \
            renderer_gles_dispatch renderer_gles_alpha renderer_gles_upload \
            android_host_storage android_retail_data android_retail_import \
            android_document_source android_setup_task android_setup_flow \
            android_touch_setup android_touch_layout android_interface_setup \
            android_private_export android_document_export android_async \
            android_basepath android_console_input android_lifecycle \
            android_savepath android_window_lifecycle; do
            echo "::group::${test}"
            python "tools/tests/${test}.py"
            echo "::endgroup::"
          done

  unified-gamelib:
    name: Unified GameLib (${{ matrix.platform }})
    needs: scaffold-contracts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            os: windows-2025
            arch: x64
            module: game_x64.dll
            client: openPR06-client_x64.exe
            dedicated: openPR06-ded_x64.exe
            renderer_gl: renderer-gl_x64.dll
            renderer_vk: renderer-vk_x64.dll
          # The ARM64 lanes match openQ4's push verification: both build
          # natively on GitHub's ARM64 runners, the same images the release
          # lanes use, so ARM64 breakage shows up on the push, not at release.
          - platform: Windows ARM64
            os: windows-11-arm
            arch: arm64
            module: game_arm64.dll
            client: openPR06-client_arm64.exe
            dedicated: openPR06-ded_arm64.exe
            renderer_gl: renderer-gl_arm64.dll
            renderer_vk: renderer-vk_arm64.dll
          - platform: Linux x64
            os: ubuntu-24.04
            arch: x64
            module: game_x64.so
            client: openPR06-client_x64
            dedicated: openPR06-ded_x64
            renderer_gl: renderer-gl_x64.so
            renderer_vk: renderer-vk_x64.so
          - platform: Linux ARM64
            os: ubuntu-24.04-arm
            arch: arm64
            module: game_arm64.so
            client: openPR06-client_arm64
            dedicated: openPR06-ded_arm64
            renderer_gl: renderer-gl_arm64.so
            renderer_vk: renderer-vk_arm64.so
          # The macOS lanes match openQ4's push verification: ARM64 in both
          # graphics bridges, and one Intel lane so the x86_64 slice keeps
          # building. The macOS client links its OpenGL renderer statically,
          # so no renderer-gl module is staged there.
          - platform: macOS ARM64 OpenGL
            os: macos-15
            arch: arm64
            macos_graphics_bridge: opengl
            module: game_arm64.dylib
            client: openPR06-client_arm64
            dedicated: openPR06-ded_arm64
            renderer_gl: ""
            renderer_vk: renderer-vk_arm64.dylib
          - platform: macOS ARM64 Metal
            os: macos-15
            arch: arm64
            macos_graphics_bridge: metal
            module: game_arm64.dylib
            client: openPR06-client_arm64
            dedicated: openPR06-ded_arm64
            renderer_gl: ""
            renderer_vk: renderer-vk_arm64.dylib
          - platform: macOS Intel x64 OpenGL
            os: macos-15-intel
            arch: x64
            macos_graphics_bridge: opengl
            module: game_x64.dylib
            client: openPR06-client_x64
            dedicated: openPR06-ded_x64
            renderer_gl: ""
            renderer_vk: renderer-vk_x64.dylib

    steps:
      - name: Checkout openPR06
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Meson and Ninja
        shell: bash
        run: python -m pip install meson ninja

      # The engine links system GL and builds SDL3 from its wrap, which needs the
      # X11, Wayland and audio development headers. Same list as upstream
      # openQ4's Linux x64 validation lane, without its Wayland smoke compositor.
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y \
              binutils \
              libasound2-dev \
              libdbus-1-dev \
              libdecor-0-dev \
              libdrm-dev \
              libegl1-mesa-dev \
              libfribidi-dev \
              libgbm-dev \
              libgl1-mesa-dri \
              libgl1-mesa-dev \
              libglx-mesa0 \
              libibus-1.0-dev \
              libjack-dev \
              libopenal-dev \
              libpipewire-0.3-dev \
              libpulse-dev \
              libsndio-dev \
              libthai-dev \
              libudev-dev \
              libwayland-dev \
              libx11-dev \
              libxcursor-dev \
              libxext-dev \
              libxfixes-dev \
              libxi-dev \
              libxkbcommon-dev \
              libxrandr-dev \
              libxss-dev \
              libxtst-dev \
              libxxf86dga-dev \
              libxxf86vm-dev; then
              exit 0
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "Failed to install Linux native dependencies after ${attempt} attempts."
              exit 1
            fi

            echo "Linux dependency installation attempt ${attempt} failed; retrying in 10 seconds..."
            sleep 10
          done

      # OpenAL Soft is built from source for ARM64, so keep the prepared
      # install between pushes, as openQ4's push verification does.
      - name: Restore prepared OpenAL Soft (Windows)
        if: runner.os == 'Windows'
        id: openal_cache
        uses: actions/cache@v6
        with:
          path: .tmp/openal-soft-${{ matrix.arch }}
          key: openal-soft-windows-${{ matrix.arch }}-${{ hashFiles('tools/build/prepare_windows_openal.ps1') }}

      # Staging bundles OpenAL32.dll beside the client. The runner has no local
      # src/external/openal-soft runtime, so prepare one as upstream openQ4 does.
      - name: Prepare OpenAL Soft (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outputRoot = Join-Path $env:GITHUB_WORKSPACE ".tmp/openal-soft-${{ matrix.arch }}"
          $cached = "${{ steps.openal_cache.outputs.cache-hit }}" -eq "true" -and
            (Test-Path (Join-Path $outputRoot "bin/OpenAL32.dll")) -and (Test-Path (Join-Path $outputRoot "lib/OpenAL32.lib"))
          if ($cached) {
            Write-Host "Using the cached OpenAL Soft install: $outputRoot"
          } else {
            $env:OPENPR06_VS_TARGET_ARCH = "${{ matrix.arch }}"
            powershell -NoProfile -ExecutionPolicy Bypass -File tools/build/prepare_windows_openal.ps1 -Architecture "${{ matrix.arch }}" -OutputRoot $outputRoot
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "OPENPR06_OPENAL_ROOT=$outputRoot" >> $env:GITHUB_ENV

      # Same pinned OpenAL Soft the macOS release lanes bundle.
      - name: Prepare pinned OpenAL Soft (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          prepared_root="${GITHUB_WORKSPACE}/.tmp/openal-soft-macos-${{ matrix.arch }}"
          bash tools/build/prepare_macos_openal_soft.sh \
            --architecture "${{ matrix.arch }}" \
            --deployment-target 11.0 \
            --output-root "${prepared_root}"
          echo "OPENPR06_MACOS_OPENAL_ROOT=${prepared_root}" >> "${GITHUB_ENV}"
          echo "PKG_CONFIG_PATH=${prepared_root}/lib/pkgconfig" >> "${GITHUB_ENV}"

      - name: Configure, build, and stage (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:OPENPR06_VS_TARGET_ARCH = "${{ matrix.arch }}"
          $setupArgs = @(
            "setup", "--wipe", "builddir", ".",
            "--backend", "ninja",
            "--buildtype", "debug",
            "--wrap-mode=forcefallback",
            "-Dbuild_engine=true",
            "-Dbuild_games=true",
            "-Dbuild_renderer_gl=true",
            "-Dbuild_renderer_vk=true",
            # The bundled OpenAL import library is x64-only; every lane links the
            # OpenAL Soft prepared above for its architecture, as the release does.
            "-Dopenal_root_override=$env:OPENPR06_OPENAL_ROOT"
          )
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build/meson_setup.ps1 @setupArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build/meson_setup.ps1 compile -C builddir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build/meson_setup.ps1 install -C builddir --no-rebuild --skip-subprojects
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure, build, and stage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build/meson_setup.sh setup --wipe builddir . --backend ninja --buildtype debug --wrap-mode=forcefallback -Dbuild_engine=true -Dbuild_games=true -Dbuild_renderer_gl=true -Dbuild_renderer_vk=true
          bash tools/build/meson_setup.sh compile -C builddir
          bash tools/build/meson_setup.sh install -C builddir --no-rebuild --skip-subprojects

      - name: Configure, build, and stage (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # Keep Meson subprojects on the main project's macOS 11.0 floor.
          export MACOSX_DEPLOYMENT_TARGET=11.0
          bash tools/build/meson_setup.sh setup --wipe builddir . --backend ninja --buildtype debug --wrap-mode=forcefallback -Dbuild_engine=true -Dbuild_games=true -Dbuild_renderer_gl=true -Dbuild_renderer_vk=true -Dplatform_backend=sdl3 "-Dmacos_graphics_bridge=${{ matrix.macos_graphics_bridge }}" -Dmacos_openal_provider=system
          bash tools/build/meson_setup.sh compile -C builddir
          bash tools/build/meson_setup.sh install -C builddir --no-rebuild --skip-subprojects
          bash tools/build/prepare_macos_openal_soft.sh \
            --verify-only \
            --architecture "${{ matrix.arch }}" \
            --deployment-target 11.0 \
            --output-root "${OPENPR06_MACOS_OPENAL_ROOT}" \
            --stage-install-dir .install

      - name: Verify unified staged payload
        shell: bash
        run: |
          set -euo pipefail
          test -f ".install/${{ matrix.client }}"
          test -f ".install/${{ matrix.dedicated }}"
          if [ -n "${{ matrix.renderer_gl }}" ]; then
            test -f ".install/${{ matrix.renderer_gl }}"
          fi
          test -f ".install/${{ matrix.renderer_vk }}"
          test -f ".install/basepr/${{ matrix.module }}"
          test -f ".install/basepr/pak0.pk4"
          test -f ".install/basepr/pak1.pk4"
          test -f ".install/basepr/mod.json"
          test -f ".install/openPR06.ico"
          test -f ".install/openPR06.icns"
          if [ "${{ runner.os }}" = "Linux" ]; then
            test -f ".install/share/applications/openpr06.desktop"
            test -f ".install/share/applications/openpr06-steamdeck.desktop"
            test -f ".install/share/icons/hicolor/256x256/apps/openpr06.png"
          fi
          if find .install/basepr -maxdepth 1 -type f \( \
              -name 'game-sp_*' -o -name 'game-mp_*' -o \
              -name 'game_sp_*' -o -name 'game_mp_*' \) | grep -q .; then
            echo "Split GameLib artifacts must not be staged; openPR06 ships one game_<arch> module."
            exit 1
          fi

      # Checks the staged binaries' install names, exported GetGameAPI and
      # bundled OpenAL on macOS, as the release lanes do.
      - name: Validate staged binaries and package layout (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python tools/validation/openq4_validate.py push \
            --skip-build \
            --install \
            --skip-python-tests
