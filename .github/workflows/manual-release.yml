name: openPR06 Manual Release

# Builds, packages and publishes an openPR06 release on openQ4's desktop
# platform set: Windows x64 and ARM64, Linux x64 and ARM64 (with AppImages),
# and macOS ARM64 in its OpenGL and Metal-bridge variants. Adapted from
# upstream openQ4's manual-release workflow for openPR06's in-tree Prey game
# library, its unified game_<arch> module and its basepr/ runtime layout.
#
# Support tiers follow openQ4's defaults. Linux ARM64 ships as a preview
# (-preview names). macOS ships unsigned and unnotarized (-unsigned.tar.gz)
# unless the Apple Developer ID and notary secrets are configured, in which
# case it ships signed, notarized DMGs. openPR06 has no first-class evidence
# gates for either yet, so there is no first-class selector.
#
# Not carried over from openQ4:
# - No Android APK yet. android-build.yml builds and verifies openPR06's APK,
#   but the repository has no Android release-signing secrets or certificate;
#   docs/dev/android-build.md (Release signing) lists what the lane needs.
# - No Discord step. discord-release.yml reacts to published releases on its
#   own, and a release created with GITHUB_TOKEN does not trigger it anyway.
# - No standalone content-pack job or assets. pak0, pak1 and pak2
#   (tools/build/content_packs.json) are built from source by every platform
#   build and ship inside each archive, AppImage, app bundle and installer.
# - No in-game update manifest (openpr06-update.json), signing or -update
#   archives. openPR06 has no update signing key; its updater only links
#   players to the releases page.
# - No assetless runtime smoke under Wayland/X11 or from the macOS app bundle:
#   PREY's game module does not define g_allowAssetlessStartup, so the client
#   cannot start without a retail PREY install, which CI does not have.

on:
  workflow_dispatch:
    inputs:
      bump_mode:
        description: Release bump policy
        required: true
        default: auto
        type: choice
        options:
          - auto
          - major (x..)
          - minor (.x.)
          - patch (..x)
      version_override:
        description: Optional explicit release version (for example 0.15.0)
        required: false
        default: ""
        type: string
      draft:
        description: Leave the release as an unpublished draft
        required: false
        default: true
        type: boolean
      prerelease:
        description: Publish as a prerelease without replacing the latest stable release
        required: false
        default: false
        type: boolean

concurrency:
  group: openpr06-manual-releases
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Release Metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      current_version: ${{ steps.version.outputs.current_version }}
      latest_release_tag: ${{ steps.version.outputs.latest_release_tag }}
      latest_release_version: ${{ steps.version.outputs.latest_release_version }}
      version: ${{ steps.version.outputs.version }}
      version_tag: ${{ steps.version.outputs.version_tag }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_name: ${{ steps.version.outputs.release_name }}
      release_scale: ${{ steps.version.outputs.release_scale }}
      release_reason: ${{ steps.version.outputs.release_reason }}
      bump_mode: ${{ steps.version.outputs.bump_mode }}
      openpr06_source_sha: ${{ steps.source_revisions.outputs.openpr06_source_sha }}
      source_date_epoch: ${{ steps.source_revisions.outputs.source_date_epoch }}
      release_matrix: ${{ steps.release_matrix.outputs.release_matrix }}
      expected_assets: ${{ steps.release_matrix.outputs.expected_assets }}
      runtime_archives: ${{ steps.release_matrix.outputs.runtime_archives }}
      macos_signed_release_enabled: ${{ steps.release_matrix.outputs.macos_signed_release_enabled }}
      macos_release_reason: ${{ steps.release_matrix.outputs.macos_release_reason }}
      linux_arm64_release_reason: ${{ steps.release_matrix.outputs.linux_arm64_release_reason }}

    steps:
      - name: Checkout openPR06
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Fetch tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin

      # The Prey game library (src/game, src/Prey, src/preyengine) is in-tree,
      # so the triggering openPR06 commit is the only source revision.
      - name: Resolve immutable source revision
        id: source_revisions
        shell: bash
        run: |
          set -euo pipefail

          # Releases are cut from main or from a release/<version> branch; the
          # branch version is checked against the computed version below.
          case "${GITHUB_REF}" in
            refs/heads/main) source_branch=main ;;
            refs/heads/release/*) source_branch="${GITHUB_REF#refs/heads/}" ;;
            *)
              echo "openPR06 releases must be dispatched from refs/heads/main or refs/heads/release/<version>; got ${GITHUB_REF}."
              exit 1
              ;;
          esac

          openpr06_source_sha="$(git rev-parse --verify "${GITHUB_SHA}^{commit}")"
          checkout_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          if [[ ! "${openpr06_source_sha}" =~ ^[0-9a-f]{40}$ ]] || [ "${checkout_sha}" != "${openpr06_source_sha}" ]; then
            echo "The checked-out openPR06 release candidate does not match triggering GITHUB_SHA=${GITHUB_SHA}."
            exit 1
          fi
          source_date_epoch="$(git show -s --format=%ct "${openpr06_source_sha}")"
          if [[ ! "${source_date_epoch}" =~ ^[0-9]{1,12}$ ]]; then
            echo "Triggering openPR06 commit has an invalid source timestamp: ${source_date_epoch}"
            exit 1
          fi

          git fetch --force origin "refs/heads/${source_branch}:refs/remotes/origin/${source_branch}"
          if ! git merge-base --is-ancestor "${openpr06_source_sha}" "refs/remotes/origin/${source_branch}"; then
            echo "Triggering openPR06 commit ${openpr06_source_sha} is not reachable from origin/${source_branch}."
            exit 1
          fi

          {
            echo "openpr06_source_sha=${openpr06_source_sha}"
            echo "source_date_epoch=${source_date_epoch}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### Release source revision"
            echo "- openPR06: \`${openpr06_source_sha}\` (${GITHUB_REF}, in-tree Prey game library)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # With no earlier v* tag on origin, the helper reports an empty
      # latest_release_tag and starts from the configured or overridden version.
      - name: Compute release version
        id: version
        env:
          INPUT_BUMP_MODE: ${{ inputs.bump_mode }}
          INPUT_VERSION_OVERRIDE: ${{ inputs.version_override }}
        shell: bash
        run: |
          set -euo pipefail

          args=(
            --source-root .
            --bump-mode "${INPUT_BUMP_MODE}"
          )

          if [ -n "${INPUT_VERSION_OVERRIDE}" ]; then
            args+=(--version-override "${INPUT_VERSION_OVERRIDE}")
          fi

          python tools/build/openq4_release_version.py "${args[@]}" >> "${GITHUB_OUTPUT}"

      - name: Validate release-tag candidate
        env:
          OPENPR06_SOURCE_SHA: ${{ steps.source_revisions.outputs.openpr06_source_sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Computed release tag is not a vMAJOR.MINOR.PATCH tag: ${RELEASE_TAG@Q}"
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/heads/release/* ]] && [ "${GITHUB_REF#refs/heads/release/}" != "${RELEASE_VERSION}" ]; then
            echo "Branch ${GITHUB_REF#refs/heads/} cannot publish version ${RELEASE_VERSION}; pass version_override=${GITHUB_REF#refs/heads/release/} or dispatch from the matching branch."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            existing_tag_sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
            if [ "${existing_tag_sha}" != "${OPENPR06_SOURCE_SHA}" ]; then
              echo "Existing release tag ${RELEASE_TAG} targets ${existing_tag_sha}, not triggering candidate ${OPENPR06_SOURCE_SHA}."
              exit 1
            fi
          fi
          {
            echo "### Release version"
            echo "- Version: \`${RELEASE_VERSION}\`, tag \`${RELEASE_TAG}\`"
            echo "- Previous release: \`${{ steps.version.outputs.latest_release_tag || 'none' }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      # One matrix entry per published package. The same script lists the
      # exact asset set the release job must find, so a lane cannot be added
      # or dropped without its assets following.
      - name: Build release matrix
        id: release_matrix
        env:
          MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
          OPENPR06_RELEASE_VERSION_TAG: ${{ steps.version.outputs.version_tag }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          import os
          import re

          tag = os.environ["OPENPR06_RELEASE_VERSION_TAG"].strip()
          if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", tag) is None:
              raise SystemExit(f"Unsafe release version tag: {tag!r}")

          required_macos_secrets = (
              "MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64",
              "MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD",
              "MACOS_DEVELOPER_ID_APPLICATION_IDENTITY",
              "MACOS_NOTARY_APPLE_ID",
              "MACOS_NOTARY_TEAM_ID",
              "MACOS_NOTARY_APP_PASSWORD",
          )
          missing_macos_secrets = [name for name in required_macos_secrets if not os.environ.get(name)]
          macos_signed = not missing_macos_secrets
          macos_release_mode = "signed" if macos_signed else "unsigned"
          macos_archive_format = "dmg" if macos_signed else "tar.gz"
          macos_unsigned_suffix = "" if macos_signed else "-unsigned"
          macos_unsigned_label = "" if macos_signed else " (unsigned)"

          def entry(os_image, platform, label, arch, archive_format, *, suffix="", bridge="opengl"):
              return {
                  "os": os_image,
                  "platform": platform,
                  "label": label,
                  "binary_arch": arch,
                  "package_suffix": suffix,
                  "archive_format": archive_format,
                  "archive_ext": "." + archive_format,
                  "macos_graphics_bridge": bridge,
                  "macos_release_mode": macos_release_mode if platform == "macos" else "",
              }

          # Same runner images as openQ4's release lanes.
          matrix = [
              entry("windows-2025", "windows", "Windows x64", "x64", "zip"),
              entry("windows-11-arm", "windows", "Windows ARM64", "arm64", "zip"),
              entry("ubuntu-24.04", "linux", "Linux x64", "x64", "tar.xz"),
              entry("ubuntu-24.04-arm", "linux", "Linux ARM64 (preview)", "arm64", "tar.xz", suffix="-preview"),
              entry("macos-15", "macos", f"macOS ARM64 OpenGL{macos_unsigned_label}", "arm64",
                    macos_archive_format, suffix=f"-opengl{macos_unsigned_suffix}", bridge="opengl"),
              entry("macos-15", "macos", f"macOS ARM64 Metal{macos_unsigned_label}", "arm64",
                    macos_archive_format, suffix=f"-metal{macos_unsigned_suffix}", bridge="metal"),
          ]

          appimage_arches = {"x64": "x86_64", "arm64": "aarch64"}
          expected = []
          runtime_archives = []
          for item in matrix:
              stem = f"openpr06-{tag}-{item['platform']}-{item['binary_arch']}{item['package_suffix']}"
              archive = stem + item["archive_ext"]
              expected.append(archive)
              if item["platform"] == "windows":
                  expected += [f"{stem}-symbols.zip", f"openpr06-{tag}-windows-{item['binary_arch']}-setup.exe"]
              elif item["platform"] == "linux":
                  appimage = f"openpr06-{tag}{item['package_suffix']}-{appimage_arches[item['binary_arch']]}.AppImage"
                  expected += [f"{stem}-debugsymbols.tar.xz", appimage, appimage + ".zsync"]
              else:
                  expected.append(f"{stem}-symbols.tar.xz")
              if item["archive_format"] != "dmg":
                  runtime_archives.append({
                      "name": archive,
                      "root": stem,
                      "platform": item["platform"],
                      "arch": item["binary_arch"],
                  })

          if macos_signed:
              macos_release_reason = "macOS preview signed/notarized DMG release artifacts enabled."
          else:
              macos_release_reason = (
                  "Preview macOS unsigned/unnotarized tar.gz release artifacts enabled as fallback output "
                  "because Apple signing/notary repository secrets are not configured: "
                  + ", ".join(missing_macos_secrets)
              )
          linux_arm64_release_reason = (
              "Linux ARM64 preview artifacts enabled. First-class publication needs real-hardware "
              "PREY SP/MP, dedicated-server, audio, input, display and package evidence."
          )

          print("macos_signed_release_enabled=" + ("true" if macos_signed else "false"))
          print(f"macos_release_reason={macos_release_reason}")
          print(f"linux_arm64_release_reason={linux_arm64_release_reason}")
          print("release_matrix=" + json.dumps({"include": matrix}, separators=(",", ":")))
          print("expected_assets=" + json.dumps(expected, separators=(",", ":")))
          print("runtime_archives=" + json.dumps(runtime_archives, separators=(",", ":")))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Release lanes\n")
              summary.writelines(f"- {item['label']}\n" for item in matrix)
          PY

  builds:
    name: ${{ matrix.label }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.release_matrix) }}

    steps:
      - name: Checkout openPR06
        uses: actions/checkout@v6
        with:
          # Save payloads use the engine commit count as their build number.
          # A shallow checkout makes every release build 1 and rejects its saves.
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.openpr06_source_sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Meson and Ninja
        shell: bash
        run: python -m pip install meson ninja markdown

      - name: Show release metadata
        env:
          RELEASE_REASON: ${{ needs.metadata.outputs.release_reason }}
          MACOS_RELEASE_REASON: ${{ needs.metadata.outputs.macos_release_reason }}
          LINUX_ARM64_RELEASE_REASON: ${{ needs.metadata.outputs.linux_arm64_release_reason }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Configured repo version: ${{ needs.metadata.outputs.current_version }}"
          echo "Latest release tag: ${{ needs.metadata.outputs.latest_release_tag || 'none' }}"
          echo "Release version: ${{ needs.metadata.outputs.version }}"
          echo "Release tag: ${{ needs.metadata.outputs.release_tag }}"
          echo "Release scale: ${{ needs.metadata.outputs.release_scale }}"
          echo "Release reason: ${RELEASE_REASON}"
          echo "openPR06 source SHA: ${{ needs.metadata.outputs.openpr06_source_sha }}"
          echo "${MACOS_RELEASE_REASON}"
          echo "${LINUX_ARM64_RELEASE_REASON}"

      # Same list as openpr06-validation.yml, plus what the AppImage lane needs.
      - name: Install Linux native dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y \
              binutils \
              desktop-file-utils \
              libasound2-dev \
              libdbus-1-dev \
              libdecor-0-dev \
              libdrm-dev \
              libegl1-mesa-dev \
              libfribidi-dev \
              libgbm-dev \
              libgl1-mesa-dri \
              libgl1-mesa-dev \
              libglx-mesa0 \
              libibus-1.0-dev \
              libjack-dev \
              libopenal-dev \
              libpipewire-0.3-dev \
              libpulse-dev \
              libsndio-dev \
              libthai-dev \
              libudev-dev \
              libwayland-dev \
              libx11-dev \
              libxcursor-dev \
              libxext-dev \
              libxfixes-dev \
              libxi-dev \
              libxkbcommon-dev \
              libxrandr-dev \
              libxss-dev \
              libxtst-dev \
              libxxf86dga-dev \
              libxxf86vm-dev \
              zsync; then
              exit 0
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "Failed to install Linux native dependencies after ${attempt} attempts."
              exit 1
            fi

            echo "Linux dependency installation attempt ${attempt} failed; retrying in 10 seconds..."
            sleep 10
          done

      - name: Install macOS native dependencies and prepare pinned OpenAL Soft
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          prepared_root="${GITHUB_WORKSPACE}/.tmp/openal-soft-macos-${{ matrix.binary_arch }}"
          bash tools/build/prepare_macos_openal_soft.sh \
            --architecture "${{ matrix.binary_arch }}" \
            --deployment-target 11.0 \
            --output-root "${prepared_root}"
          echo "OPENPR06_MACOS_OPENAL_ROOT=${prepared_root}" >> "${GITHUB_ENV}"
          echo "PKG_CONFIG_PATH=${prepared_root}/lib/pkgconfig" >> "${GITHUB_ENV}"

      # Staging and packaging bundle OpenAL32.dll beside the client; the
      # runner has no local src/external/openal-soft runtime.
      - name: Prepare OpenAL Soft (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outputRoot = Join-Path $env:GITHUB_WORKSPACE ".tmp/openal-soft-${{ matrix.binary_arch }}"
          $env:OPENPR06_VS_TARGET_ARCH = "${{ matrix.binary_arch }}"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build/prepare_windows_openal.ps1 -Architecture "${{ matrix.binary_arch }}" -OutputRoot $outputRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OPENPR06_OPENAL_ROOT=$outputRoot" >> $env:GITHUB_ENV

      # debugoptimized with assertions off is the release configuration: it
      # keeps the PDBs, DWARF and dSYMs that the symbol archives are cut from.
      - name: Configure, build, and stage (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:OPENPR06_VS_TARGET_ARCH = "${{ matrix.binary_arch }}"

          $setupArgs = @(
            "setup",
            "--wipe",
            "builddir",
            ".",
            "--backend",
            "ninja",
            "--buildtype=debugoptimized",
            "-Db_ndebug=true",
            "--wrap-mode=forcefallback",
            "-Dbuild_engine=true",
            "-Dbuild_games=true",
            "-Dbuild_renderer_gl=true",
            "-Dbuild_renderer_vk=true",
            "-Dplatform_backend=sdl3",
            "-Dversion_track=stable",
            "-Dversion_base_override=${{ needs.metadata.outputs.version }}"
          )
          # The bundled OpenAL import library is x64-only; every lane links the
          # OpenAL Soft that the previous step built for its architecture.
          if (-not [string]::IsNullOrWhiteSpace($env:OPENPR06_OPENAL_ROOT)) {
            $setupArgs += "-Dopenal_root_override=$env:OPENPR06_OPENAL_ROOT"
          }

          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build/meson_setup.ps1 @setupArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build/meson_setup.ps1 compile -C builddir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build/meson_setup.ps1 install -C builddir --no-rebuild --skip-subprojects
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure, build, and stage (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ matrix.platform }}" = "linux" ]; then
            export SOURCE_DATE_EPOCH="${{ needs.metadata.outputs.source_date_epoch }}"
          fi
          if [ "${{ matrix.platform }}" = "macos" ]; then
            # Keep Meson subprojects (SDL3, GLEW, stb_vorbis) on the same macOS 11.0
            # floor as the main project's -mmacosx-version-min=11.0 flags.
            export MACOSX_DEPLOYMENT_TARGET=11.0
          fi

          # build_renderer_gl stays off on darwin by itself: the macOS client
          # links its OpenGL renderer statically.
          setup_args=(
            setup
            --wipe
            builddir
            .
            --backend
            ninja
            --buildtype=debugoptimized
            -Db_ndebug=true
            --wrap-mode=forcefallback
            -Dbuild_engine=true
            -Dbuild_games=true
            -Dbuild_renderer_gl=true
            -Dbuild_renderer_vk=true
            -Dplatform_backend=sdl3
            -Dversion_track=stable
            "-Dversion_base_override=${{ needs.metadata.outputs.version }}"
          )
          if [ "${{ matrix.platform }}" = "linux" ]; then
            setup_args+=(-Dlinux_x11=enabled)
          fi
          if [ "${{ matrix.platform }}" = "macos" ]; then
            setup_args+=(
              "-Dmacos_graphics_bridge=${{ matrix.macos_graphics_bridge }}"
              -Dmacos_openal_provider=system
            )
          fi

          bash tools/build/meson_setup.sh "${setup_args[@]}"
          bash tools/build/meson_setup.sh compile -C builddir
          bash tools/build/meson_setup.sh install -C builddir --no-rebuild --skip-subprojects
          if [ "${{ matrix.platform }}" = "macos" ]; then
            bash tools/build/prepare_macos_openal_soft.sh \
              --verify-only \
              --architecture "${{ matrix.binary_arch }}" \
              --deployment-target 11.0 \
              --output-root "${OPENPR06_MACOS_OPENAL_ROOT}" \
              --stage-install-dir .install
          fi

      - name: Verify checked-out and configured source provenance
        shell: bash
        run: |
          set -euo pipefail
          python tools/build/verify_release_source_provenance.py \
            --project-root "${GITHUB_WORKSPACE}" \
            --expected-project-commit "${{ needs.metadata.outputs.openpr06_source_sha }}" \
            --build-dir builddir

      - name: Verify unified staged payload
        shell: bash
        run: |
          set -euo pipefail
          arch="${{ matrix.binary_arch }}"
          case "${{ matrix.platform }}" in
            windows) exe_ext=".exe"; module_ext=".dll" ;;
            linux) exe_ext=""; module_ext=".so" ;;
            macos) exe_ext=""; module_ext=".dylib" ;;
          esac
          required=(
            "openPR06-client_${arch}${exe_ext}"
            "openPR06-ded_${arch}${exe_ext}"
            "renderer-vk_${arch}${module_ext}"
            "basepr/game_${arch}${module_ext}"
            "basepr/mod.json"
            "openPR06.ico"
            "openPR06.icns"
          )
          # macOS links the OpenGL renderer into the client, and app bundles are
          # replaced whole, so neither the GL module nor the updater is staged there.
          if [ "${{ matrix.platform }}" != "macos" ]; then
            required+=(
              "renderer-gl_${arch}${module_ext}"
              "openPR06-updater_${arch}${exe_ext}"
            )
          fi
          if [ "${{ matrix.platform }}" = "linux" ]; then
            required+=(
              "share/applications/openpr06.desktop"
              "share/applications/openpr06-steamdeck.desktop"
              "share/icons/hicolor/256x256/apps/openpr06.png"
            )
          fi
          while IFS='|' read -r pack _; do
            required+=("basepr/${pack}")
          done < <(python tools/build/content_packs.py meson-list)
          for item in "${required[@]}"; do
            if [ ! -f ".install/${item}" ]; then
              echo "Staged release payload is missing .install/${item}"
              exit 1
            fi
          done
          if find .install/basepr -maxdepth 1 -type f \( \
              -name 'game-sp_*' -o -name 'game-mp_*' -o \
              -name 'game_sp_*' -o -name 'game_mp_*' \) | grep -q .; then
            echo "Split GameLib artifacts must not be staged; openPR06 ships one game_<arch> module."
            exit 1
          fi

      # Checks the arch-suffixed binaries, Linux hardening and runtime
      # dependencies, the staged OpenAL runtime, the Windows PDB set and the
      # macOS install names. With --skip-build, --install only validates the
      # already-staged tree; it does not re-run meson install.
      - name: Validate staged binaries and package layout
        shell: bash
        run: |
          set -euo pipefail
          python tools/validation/openq4_validate.py push \
            --skip-build \
            --install \
            --skip-python-tests

      - name: Prepare Linux debug symbols
        if: matrix.platform == 'linux'
        id: linux_symbols
        shell: bash
        run: |
          set -euo pipefail

          arch="${{ matrix.binary_arch }}"
          symbols_stem="openpr06-${{ needs.metadata.outputs.version_tag }}-linux-${arch}${{ matrix.package_suffix }}-debugsymbols"
          symbols_dir="${RUNNER_TEMP}/${symbols_stem}"
          symbols_archive="${RUNNER_TEMP}/${symbols_stem}.tar.xz"
          rm -rf "${symbols_dir}" "${symbols_archive}"
          mkdir -p "${symbols_dir}/basepr"

          binaries=(
            ".install/openPR06-client_${arch}"
            ".install/openPR06-ded_${arch}"
            ".install/openPR06-updater_${arch}"
            ".install/renderer-gl_${arch}.so"
            ".install/renderer-vk_${arch}.so"
            ".install/basepr/game_${arch}.so"
          )

          for binary in "${binaries[@]}"; do
            if [ ! -f "${binary}" ]; then
              echo "Required Linux binary for debug-symbol split is missing: ${binary}"
              exit 1
            fi

            relative_path="${binary#.install/}"
            debug_file="${symbols_dir}/${relative_path}.debug"
            mkdir -p "$(dirname "${debug_file}")"

            binary_abs="$(pwd -P)/${binary#./}"
            debug_basename="$(basename "${debug_file}")"

            objcopy --only-keep-debug "${binary_abs}" "${debug_file}"
            objcopy --strip-debug "${binary_abs}"
            (
              cd "$(dirname "${debug_file}")"
              objcopy --add-gnu-debuglink="${debug_basename}" "${binary_abs}"
            )
          done

          tar -C "${symbols_dir}" -cJf "${symbols_archive}" .
          echo "debug_symbols_dir=${symbols_dir}" >> "${GITHUB_OUTPUT}"
          echo "debug_symbols_path=${symbols_archive}" >> "${GITHUB_OUTPUT}"

      # Stripped runtime ELFs, matching .gnu_debuglink names, CRCs and build
      # IDs, DWARF only in the detached files, hardening and resolvable
      # dependencies, re-checked after the strip mutated the staged binaries.
      - name: Validate stripped Linux ELFs and detached symbols
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          python tools/build/verify_linux_release_artifacts.py split \
            --runtime-root "${GITHUB_WORKSPACE}/.install" \
            --symbols-root "${{ steps.linux_symbols.outputs.debug_symbols_dir }}" \
            --arch "${{ matrix.binary_arch }}"

      - name: Import macOS Developer ID certificate
        if: matrix.platform == 'macos' && matrix.macos_release_mode == 'signed'
        id: macos_signing
        env:
          MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64
            MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD
            MACOS_DEVELOPER_ID_APPLICATION_IDENTITY
            MACOS_NOTARY_APPLE_ID
            MACOS_NOTARY_TEAM_ID
            MACOS_NOTARY_APP_PASSWORD
          )
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name}" ]; then
              echo "${var_name} must be configured before publishing signed macOS release packages."
              exit 1
            fi
          done

          keychain_path="${RUNNER_TEMP}/openpr06-release-signing.keychain-db"
          certificate_path="${RUNNER_TEMP}/developer-id-application.p12"
          keychain_password="$(openssl rand -hex 24)"
          notary_profile="openpr06-release-notary"

          printf '%s' "${MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64}" | base64 -D > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${MACOS_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign
          rm -f "${certificate_path}"
          # macOS runners ship bash 3.2, so use a while-read loop instead of mapfile.
          existing_keychains=()
          while IFS= read -r keychain_line; do
            if [ -n "${keychain_line}" ]; then
              existing_keychains+=("${keychain_line}")
            fi
          done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')
          security list-keychains -d user -s "${keychain_path}" "${existing_keychains[@]}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain_path}"

          xcrun notarytool store-credentials "${notary_profile}" \
            --apple-id "${MACOS_NOTARY_APPLE_ID}" \
            --team-id "${MACOS_NOTARY_TEAM_ID}" \
            --password "${MACOS_NOTARY_APP_PASSWORD}" \
            --keychain "${keychain_path}"

          security find-identity -v -p codesigning "${keychain_path}" | grep -F "${MACOS_DEVELOPER_ID_APPLICATION_IDENTITY}" >/dev/null
          echo "identity=${MACOS_DEVELOPER_ID_APPLICATION_IDENTITY}" >> "$GITHUB_OUTPUT"
          echo "keychain_path=${keychain_path}" >> "$GITHUB_OUTPUT"
          echo "notary_profile=${notary_profile}" >> "$GITHUB_OUTPUT"

      # macOS has no native Vulkan driver: the renderer module reaches the GPU
      # through MoltenVK, which openPR06 does not build, so Meson never
      # installs it and package_nightly.py refuses to package without it.
      # Pinned and checksum-verified by the helper.
      - name: Stage macOS MoltenVK runtime
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build/prepare_macos_moltenvk.sh --output-dir .install
          bash tools/build/prepare_macos_moltenvk.sh --verify-only --output-dir .install

      # package_release.py also writes a rootless -update archive for Windows
      # and Linux; it is not published, because openPR06 has no in-game update
      # channel.
      - name: Prepare package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          package_args=(
            --platform "${{ matrix.platform }}"
            --arch "${{ matrix.binary_arch }}"
            --version "${{ needs.metadata.outputs.version }}"
            --version-tag "${{ needs.metadata.outputs.version_tag }}"
            --archive-format "${{ matrix.archive_format }}"
            --package-suffix="${{ matrix.package_suffix }}"
            --source-root "${GITHUB_WORKSPACE}"
            --output-dir "${RUNNER_TEMP}"
          )
          if [ "${{ matrix.platform }}" = "macos" ]; then
            if [ "${{ matrix.macos_release_mode }}" = "signed" ]; then
              package_args+=(
                --macos-signing-mode developer-id
                --macos-code-sign-identity "${{ steps.macos_signing.outputs.identity }}"
                --macos-notarize
                --macos-notary-keychain-profile "${{ steps.macos_signing.outputs.notary_profile }}"
                --macos-notary-keychain "${{ steps.macos_signing.outputs.keychain_path }}"
              )
            else
              package_args+=(--macos-signing-mode ad-hoc)
            fi
          fi

          python tools/build/package_release.py "${package_args[@]}"

          package_stem="openpr06-${{ needs.metadata.outputs.version_tag }}-${{ matrix.platform }}-${{ matrix.binary_arch }}${{ matrix.package_suffix }}"
          archive_path="${RUNNER_TEMP}/${package_stem}${{ matrix.archive_ext }}"
          package_dir="${RUNNER_TEMP}/${package_stem}"
          if [ ! -f "${archive_path}" ]; then
            echo "Expected package archive not found: ${archive_path}"
            exit 1
          fi
          if [ ! -d "${package_dir}" ]; then
            echo "Expected package directory not found: ${package_dir}"
            exit 1
          fi
          if [ "${{ matrix.platform }}" = "windows" ]; then
            windows_symbols_path="${RUNNER_TEMP}/${package_stem}-symbols.zip"
            if [ ! -f "${windows_symbols_path}" ]; then
              echo "Expected Windows symbol archive not found: ${windows_symbols_path}"
              exit 1
            fi
            echo "windows_symbols_path=${windows_symbols_path}" >> "${GITHUB_OUTPUT}"
          fi
          if [ "${{ matrix.platform }}" = "macos" ]; then
            symbols_archive_path="${RUNNER_TEMP}/${package_stem}-symbols.tar.xz"
            if [ ! -f "${symbols_archive_path}" ]; then
              echo "Expected macOS dSYM symbol archive not found: ${symbols_archive_path}"
              exit 1
            fi
            echo "symbols_archive_path=${symbols_archive_path}" >> "${GITHUB_OUTPUT}"
          fi
          echo "archive_path=${archive_path}" >> "${GITHUB_OUTPUT}"
          echo "package_dir=${package_dir}" >> "${GITHUB_OUTPUT}"

      - name: Validate extracted Linux runtime archive
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          python tools/build/verify_linux_release_artifacts.py archive \
            --archive "${{ steps.package.outputs.archive_path }}" \
            --arch "${{ matrix.binary_arch }}" \
            --symbols-root "${{ steps.linux_symbols.outputs.debug_symbols_dir }}" \
            --work-root "${RUNNER_TEMP}"

      # Pinned linuxdeploy and appimagetool, the same releases and checksums
      # as openQ4's release lane.
      - name: Build and validate Linux AppImage
        if: matrix.platform == 'linux'
        id: appimage
        shell: bash
        run: |
          set -euo pipefail

          tools_dir="${RUNNER_TEMP}/openpr06-appimage-tools/${{ matrix.binary_arch }}"
          mkdir -p "${tools_dir}"

          case "${{ matrix.binary_arch }}" in
            x64)
              appimage_arch="x86_64"
              linuxdeploy_sha256="c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d"
              appimagetool_sha256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
              ;;
            arm64)
              appimage_arch="aarch64"
              linuxdeploy_sha256="620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff"
              appimagetool_sha256="f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158"
              ;;
            *)
              echo "Unsupported AppImage release architecture: ${{ matrix.binary_arch }}"
              exit 1
              ;;
          esac

          linuxdeploy="${tools_dir}/linuxdeploy-${appimage_arch}.AppImage"
          appimagetool="${tools_dir}/appimagetool-${appimage_arch}.AppImage"
          runtime_file="${tools_dir}/runtime-${appimage_arch}"

          curl --fail --location --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 \
            --output "${linuxdeploy}" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-${appimage_arch}.AppImage"
          curl --fail --location --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 \
            --output "${appimagetool}" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${appimage_arch}.AppImage"
          printf '%s  %s\n%s  %s\n' \
            "${linuxdeploy_sha256}" "${linuxdeploy}" \
            "${appimagetool_sha256}" "${appimagetool}" \
            | sha256sum --check --strict
          chmod 0755 "${linuxdeploy}" "${appimagetool}"

          # Runtime control options are handled before mounting, so this must invoke the
          # outer AppImage directly rather than the extracted appimagetool payload.
          runtime_offset="$("${appimagetool}" --appimage-offset)"
          python - "${appimagetool}" "${runtime_file}" "${runtime_offset}" <<'PY'
          import os
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2])
          try:
              offset = int(sys.argv[3], 10)
          except ValueError as exc:
              raise SystemExit(f"appimagetool returned an invalid runtime offset: {sys.argv[3]!r}") from exc
          data = source.read_bytes()
          if offset < 11 or offset >= len(data):
              raise SystemExit(f"appimagetool runtime offset {offset} is outside the {len(data)}-byte tool")
          runtime = data[:offset]
          if runtime[:4] != b"\x7fELF" or runtime[8:11] != b"AI\x02":
              raise SystemExit("appimagetool does not contain the expected type-2 runtime prefix")
          destination.write_bytes(runtime)
          os.chmod(destination, 0o755)
          PY

          appimage_name="openpr06-${{ needs.metadata.outputs.version_tag }}${{ matrix.package_suffix }}-${appimage_arch}.AppImage"
          appimage_path="${RUNNER_TEMP}/${appimage_name}"
          python tools/build/package_linux_appimage.py \
            --package-dir "${{ steps.package.outputs.package_dir }}" \
            --symbols-dir "${{ steps.linux_symbols.outputs.debug_symbols_dir }}" \
            --arch "${{ matrix.binary_arch }}" \
            --version "${{ needs.metadata.outputs.version }}" \
            --version-tag "${{ needs.metadata.outputs.version_tag }}" \
            --package-suffix="${{ matrix.package_suffix }}" \
            --source-date-epoch "${{ needs.metadata.outputs.source_date_epoch }}" \
            --linuxdeploy "${linuxdeploy}" \
            --appimagetool "${appimagetool}" \
            --runtime-file "${runtime_file}" \
            --work-root "${RUNNER_TEMP}" \
            --update-information "gh-releases-zsync|${GITHUB_REPOSITORY%%/*}|${GITHUB_REPOSITORY##*/}|latest|openpr06-*${{ matrix.package_suffix }}-${appimage_arch}.AppImage.zsync" \
            --output "${appimage_path}"

          echo "appimage_path=${appimage_path}" >> "${GITHUB_OUTPUT}"
          echo "appimage_zsync_path=${appimage_path}.zsync" >> "${GITHUB_OUTPUT}"

      - name: Install Inno Setup
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            throw "Chocolatey is not available on this Windows runner, so Inno Setup could not be installed."
          }
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Without --content-packs-manifest the installer embeds every pack the
      # package carries, so it installs offline like the zip.
      - name: Build Windows installer
        if: matrix.platform == 'windows'
        id: windows_installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python tools/build/build_windows_installer.py `
            --package-dir "${{ steps.package.outputs.package_dir }}" `
            --version "${{ needs.metadata.outputs.version }}" `
            --version-tag "${{ needs.metadata.outputs.version_tag }}" `
            --arch "${{ matrix.binary_arch }}" `
            --source-root "${env:GITHUB_WORKSPACE}" `
            --output-dir "${env:RUNNER_TEMP}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $installerPath = Join-Path $env:RUNNER_TEMP "openpr06-${{ needs.metadata.outputs.version_tag }}-windows-${{ matrix.binary_arch }}-setup.exe"
          if (-not (Test-Path -LiteralPath $installerPath)) {
            throw "Expected Windows installer not found: $installerPath"
          }

          "installer_path=$installerPath" >> $env:GITHUB_OUTPUT

      - name: Upload package archive
        uses: actions/upload-artifact@v7
        with:
          name: openpr06-release-${{ needs.metadata.outputs.version_tag }}-${{ matrix.platform }}-${{ matrix.binary_arch }}${{ matrix.package_suffix }}
          path: ${{ steps.package.outputs.archive_path }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload Windows symbols
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: openpr06-release-${{ needs.metadata.outputs.version_tag }}-windows-${{ matrix.binary_arch }}${{ matrix.package_suffix }}-symbols
          path: ${{ steps.package.outputs.windows_symbols_path }}
          if-no-files-found: error

      - name: Upload macOS dSYM symbols
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: openpr06-release-${{ needs.metadata.outputs.version_tag }}-macos-${{ matrix.binary_arch }}${{ matrix.package_suffix }}-symbols
          path: ${{ steps.package.outputs.symbols_archive_path }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload Linux debug symbols
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: openpr06-release-${{ needs.metadata.outputs.version_tag }}-linux-${{ matrix.binary_arch }}${{ matrix.package_suffix }}-debugsymbols
          path: ${{ steps.linux_symbols.outputs.debug_symbols_path }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload Linux AppImage
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: openpr06-release-${{ needs.metadata.outputs.version_tag }}-linux-${{ matrix.binary_arch }}${{ matrix.package_suffix }}-appimage
          path: |
            ${{ steps.appimage.outputs.appimage_path }}
            ${{ steps.appimage.outputs.appimage_zsync_path }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload Windows installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: openpr06-release-${{ needs.metadata.outputs.version_tag }}-windows-${{ matrix.binary_arch }}-installer
          path: ${{ steps.windows_installer.outputs.installer_path }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish Release
    needs: [metadata, builds]
    if: ${{ needs.builds.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout openPR06
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.openpr06_source_sha }}

      - name: Fetch tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin

      - name: Validate release candidate source and tag target
        env:
          OPENPR06_SOURCE_SHA: ${{ needs.metadata.outputs.openpr06_source_sha }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          case "${GITHUB_REF}" in
            refs/heads/main) source_branch=main ;;
            refs/heads/release/*) source_branch="${GITHUB_REF#refs/heads/}" ;;
            *)
              echo "Release publication is bound to refs/heads/main or refs/heads/release/<version>; got ${GITHUB_REF}."
              exit 1
              ;;
          esac
          if [ "${GITHUB_SHA}" != "${OPENPR06_SOURCE_SHA}" ]; then
            echo "Release publication is bound to the triggering commit ${OPENPR06_SOURCE_SHA}; got ${GITHUB_SHA}."
            exit 1
          fi
          checkout_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          if [ "${checkout_sha}" != "${OPENPR06_SOURCE_SHA}" ]; then
            echo "Release checkout ${checkout_sha} does not match triggering candidate ${OPENPR06_SOURCE_SHA}."
            exit 1
          fi
          git fetch --force origin "refs/heads/${source_branch}:refs/remotes/origin/${source_branch}"
          if ! git merge-base --is-ancestor "${OPENPR06_SOURCE_SHA}" "refs/remotes/origin/${source_branch}"; then
            echo "Release candidate ${OPENPR06_SOURCE_SHA} is no longer reachable from origin/${source_branch}."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            existing_tag_sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
            if [ "${existing_tag_sha}" != "${OPENPR06_SOURCE_SHA}" ]; then
              echo "Existing tag ${RELEASE_TAG} targets ${existing_tag_sha}, not candidate ${OPENPR06_SOURCE_SHA}."
              exit 1
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: openpr06-release-${{ needs.metadata.outputs.version_tag }}-*
          path: ${{ runner.temp }}/release-artifacts
          merge-multiple: true

      - name: Verify release asset set
        id: release_assets
        env:
          EXPECTED_ASSETS: ${{ needs.metadata.outputs.expected_assets }}
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="${RUNNER_TEMP}/release-artifacts"
          if [ ! -d "${artifact_dir}" ]; then
            echo "Artifact directory is missing: ${artifact_dir}"
            exit 1
          fi

          mapfile -t expected < <(python -c 'import json,os; print("\n".join(json.loads(os.environ["EXPECTED_ASSETS"])))')
          asset_manifest="${RUNNER_TEMP}/openpr06-release-assets.txt"
          expected_args=()
          for package_file in "${expected[@]}"; do
            expected_args+=(--expected "${package_file}")
          done
          python tools/build/verify_release_asset_set.py \
            --artifact-dir "${artifact_dir}" \
            --manifest "${asset_manifest}" \
            "${expected_args[@]}"
          echo "asset_manifest=${asset_manifest}" >> "${GITHUB_OUTPUT}"

      # Replaces openQ4's content-pack identity proof (which needs the dropped
      # content_packs job): every runtime archive must carry the engine, the
      # unified game module and every pack in tools/build/content_packs.json,
      # and no symbol files. macOS archives carry them inside openPR06.app.
      - name: Verify runtime archive contents
        env:
          RUNTIME_ARCHIVES: ${{ needs.metadata.outputs.runtime_archives }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/build/content_packs.py meson-list | cut -d '|' -f 1 > "${RUNNER_TEMP}/openpr06-content-packs.txt"
          python - "${RUNNER_TEMP}/release-artifacts" "${RUNNER_TEMP}/openpr06-content-packs.txt" <<'PY'
          import json
          import os
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          artifact_dir = Path(sys.argv[1])
          packs = [line.strip() for line in Path(sys.argv[2]).read_text(encoding="utf-8").splitlines() if line.strip()]
          if not packs:
              raise SystemExit("content_packs.py listed no packs")
          archives = json.loads(os.environ["RUNTIME_ARCHIVES"])
          if not archives:
              raise SystemExit("no runtime archives to verify")
          for item in archives:
              name, root, platform, arch = item["name"], item["root"], item["platform"], item["arch"]
              path = artifact_dir / name
              if name.endswith(".zip"):
                  with zipfile.ZipFile(path) as archive:
                      members = {member.rstrip("/") for member in archive.namelist()}
              else:
                  mode = "r:gz" if name.endswith(".tar.gz") else "r:xz"
                  with tarfile.open(path, mode) as archive:
                      members = {member.name.rstrip("/") for member in archive.getmembers()}
              if platform == "windows":
                  required = [f"openPR06-client_{arch}.exe", f"openPR06-ded_{arch}.exe", f"basepr/game_{arch}.dll", "basepr/mod.json"]
                  required += [f"basepr/{pack}" for pack in packs]
              elif platform == "linux":
                  required = [f"openPR06-client_{arch}", f"openPR06-ded_{arch}", f"basepr/game_{arch}.so", "basepr/mod.json"]
                  required += [f"basepr/{pack}" for pack in packs]
              else:
                  app = "openPR06.app/Contents"
                  required = [f"{app}/MacOS/openPR06", f"{app}/Frameworks/game_{arch}.dylib", f"{app}/Resources/basepr/mod.json"]
                  required += [f"{app}/Resources/basepr/{pack}" for pack in packs]
              missing = [entry for entry in required if f"{root}/{entry}" not in members]
              if missing:
                  raise SystemExit(f"{name} is missing: {', '.join(missing)}")
              debug = sorted(m for m in members if m.endswith((".pdb", ".debug")) or ".dSYM/" in m)
              if debug:
                  raise SystemExit(f"{name} carries symbol files: {', '.join(debug[:10])}")
              print(f"{name}: {len(members)} entries; packs {', '.join(packs)} present")
          PY

      - name: Generate changelog
        env:
          RELEASE_REASON: ${{ needs.metadata.outputs.release_reason }}
        shell: bash
        run: |
          set -euo pipefail

          # Uses docs/dev/releases/<tag>.md when it exists. With no earlier v*
          # tag on origin the notes carry no "Since" link.
          python tools/build/generate_release_changelog.py \
            --version "${{ needs.metadata.outputs.version }}" \
            --version-tag "${{ needs.metadata.outputs.version_tag }}" \
            --release-tag "${{ needs.metadata.outputs.release_tag }}" \
            --release-scale "${{ needs.metadata.outputs.release_scale }}" \
            --release-reason "${RELEASE_REASON}" \
            --repo "${GITHUB_REPOSITORY}" \
            --source-root "${GITHUB_WORKSPACE}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --output "${RUNNER_TEMP}/release-changelog.md"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENPR06_SOURCE_SHA: ${{ needs.metadata.outputs.openpr06_source_sha }}
          RELEASE_ASSET_MANIFEST: ${{ steps.release_assets.outputs.asset_manifest }}
          RELEASE_DRAFT: ${{ inputs.draft }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.metadata.outputs.release_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${RELEASE_DRAFT}" != "true" ] && [ "${RELEASE_DRAFT}" != "false" ]; then
            echo "Invalid draft selector: ${RELEASE_DRAFT@Q}"
            exit 1
          fi
          if [ "${RELEASE_PRERELEASE}" != "true" ] && [ "${RELEASE_PRERELEASE}" != "false" ]; then
            echo "Invalid prerelease selector: ${RELEASE_PRERELEASE@Q}"
            exit 1
          fi
          latest_policy=legacy
          if [ "${RELEASE_PRERELEASE}" = "true" ]; then
            latest_policy=false
          fi

          tag="${RELEASE_TAG}"
          name="${RELEASE_NAME}"
          target="${OPENPR06_SOURCE_SHA}"
          notes="${RUNNER_TEMP}/release-changelog.md"
          assets_dir="${RUNNER_TEMP}/release-artifacts"

          if [ -L "${RELEASE_ASSET_MANIFEST}" ] || [ ! -f "${RELEASE_ASSET_MANIFEST}" ]; then
            echo "Verified release asset manifest is missing or not a regular file: ${RELEASE_ASSET_MANIFEST}"
            exit 1
          fi
          mapfile -t asset_names < "${RELEASE_ASSET_MANIFEST}"
          assets=()
          for asset_name in "${asset_names[@]}"; do
            if [[ ! "${asset_name}" =~ ^openpr06-[A-Za-z0-9._+-]+$ ]] || [[ "${asset_name}" == *..* ]]; then
              echo "Verified release asset manifest contains an unsafe filename: ${asset_name@Q}"
              exit 1
            fi
            asset_path="${assets_dir}/${asset_name}"
            if [ -L "${asset_path}" ] || [ ! -f "${asset_path}" ]; then
              echo "Verified release asset disappeared or is not a regular file: ${asset_path}"
              exit 1
            fi
            assets+=("${asset_path}")
          done

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "Verified release asset whitelist is empty."
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            existing_tag_sha="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
            if [ "${existing_tag_sha}" != "${target}" ]; then
              echo "Refusing to update release ${tag}: tag target ${existing_tag_sha} differs from ${target}."
              exit 1
            fi
          fi

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            mapfile -t existing_release_assets < <(
              gh release view "${tag}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json assets \
                --jq '.assets[].name'
            )
            for existing_asset in "${existing_release_assets[@]}"; do
              approved=0
              for asset_name in "${asset_names[@]}"; do
                if [ "${existing_asset}" = "${asset_name}" ]; then
                  approved=1
                  break
                fi
              done
              if [ "${approved}" -ne 1 ]; then
                printf 'Existing release contains an unapproved asset: %q\n' "${existing_asset}"
                exit 1
              fi
            done

            gh release edit "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${target}" \
              --title "${name}" \
              --notes-file "${notes}"
            gh release upload "${tag}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            # Keep new downloads unpublished until their stored bytes have
            # been compared with the archives that passed validation.
            gh release create "${tag}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${target}" \
              --title "${name}" \
              --notes-file "${notes}" \
              --draft \
              --prerelease="${RELEASE_PRERELEASE}"
          fi

          mapfile -t published_release_assets < <(
            gh release view "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[].name'
          )
          if [ "${#published_release_assets[@]}" -ne "${#asset_names[@]}" ]; then
            echo "Published release asset count does not match the approved whitelist."
            exit 1
          fi
          for asset_name in "${asset_names[@]}"; do
            if ! printf '%s\n' "${published_release_assets[@]}" | grep -Fxq -- "${asset_name}"; then
              echo "Published release is missing approved asset: ${asset_name}"
              exit 1
            fi
          done

          release_id="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json databaseId --jq .databaseId)"
          published_assets_json="${RUNNER_TEMP}/openpr06-published-assets.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            > "${published_assets_json}"
          expected_args=()
          for asset_name in "${asset_names[@]}"; do
            expected_args+=(--expected "${asset_name}")
          done
          python tools/build/verify_release_asset_set.py \
            --artifact-dir "${assets_dir}" \
            --published-assets "${published_assets_json}" \
            "${expected_args[@]}"

          if [ "${RELEASE_DRAFT}" = "true" ]; then
            # A draft is not a release: GitHub creates no git tag for it, fires no
            # release event, and the release-by-tag REST endpoint never returns it.
            # Read it back through gh, which falls back to the draft listing.
            gh release edit "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --prerelease="${RELEASE_PRERELEASE}"
            draft_state="$(
              gh release view "${tag}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json isDraft,targetCommitish \
                --jq '[(.isDraft | tostring), .targetCommitish] | join(" ")'
            )"
            draft_is_draft="${draft_state%% *}"
            draft_release_target="${draft_state##* }"
            if [ "${draft_is_draft}" != "true" ]; then
              echo "Release ${tag} was requested as a draft but reports isDraft=${draft_is_draft}."
              exit 1
            fi
            if [ "${draft_release_target}" != "${target}" ]; then
              echo "Draft release ${tag} records target ${draft_release_target}, expected ${target}."
              exit 1
            fi
            {
              echo "### Draft release staged"
              echo "- Tag: \`${tag}\` (unpublished; no git tag exists until the draft is published)"
              echo "- Target: \`${target}\`"
              echo "- Assets: ${#asset_names[@]}"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # Resolve through gh so an existing unpublished draft can be promoted.
          # The release-by-tag REST endpoint only returns published releases.
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F prerelease="${RELEASE_PRERELEASE}" \
            -f make_latest="${latest_policy}" \
            -F draft=false >/dev/null

          published_state="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '[.draft, .prerelease] | map(tostring) | join(" ")')"
          if [ "${published_state}" != "false ${RELEASE_PRERELEASE}" ]; then
            echo "Published release ${tag} has unexpected draft/prerelease state: ${published_state}"
            exit 1
          fi

          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          published_tag_sha="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          if [ "${published_tag_sha}" != "${target}" ]; then
            echo "Published tag ${tag} targets ${published_tag_sha}, expected ${target}."
            exit 1
          fi
          published_release_target="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .target_commitish)"
          if [ "${published_release_target}" != "${target}" ]; then
            echo "Published release ${tag} records target ${published_release_target}, expected ${target}."
            exit 1
          fi
          {
            echo "### Release published"
            echo "- Tag: \`${tag}\` -> \`${target}\`"
            echo "- Prerelease: ${RELEASE_PRERELEASE}"
          } >> "${GITHUB_STEP_SUMMARY}"
